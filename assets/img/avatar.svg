<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M0 80 H400 M0 160 H400 M0 240 H400 M0 320 H400 M80 0 V400 M160 0 V400 M240 0 V400 M320 0 V400" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Halo / Ambient Glow -->
  <circle cx="200" cy="180" r="130" fill="url(#glowGrad)"/>
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8 6" filter="url(#glow)" opacity="0.8"/>

  <!-- Outer Tech Reticle -->
  <circle cx="200" cy="180" r="125" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4"/>
  <path d="M190 45 H210 M190 315 H210 M65 170 V190 M335 170 V190" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>

  <!-- Avatar Silhouette / Hijab Geometric Graphic -->
  <!-- Shoulders / Torso -->
  <path d="M110 350 C110 290 145 270 200 270 C255 270 290 290 290 350 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <path d="M140 350 L200 285 L260 350" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.9"/>

  <!-- Hijab Drape / Head Silhouette -->
  <path d="M145 195 C140 145 160 100 200 95 C240 100 260 145 255 195 C250 240 235 260 200 260 C165 260 150 240 145 195 Z" fill="#2d3748" stroke="#6366f1" stroke-width="2"/>
  
  <!-- Face Oval -->
  <ellipse cx="200" cy="185" rx="38" ry="46" fill="#fed7aa"/>
  
  <!-- Inner Hijab Frame -->
  <path d="M165 170 C165 140 180 135 200 135 C220 135 235 140 235 170 C235 205 220 225 200 225 C180 225 165 205 165 170 Z" fill="#fed7aa"/>
  <path d="M162 165 C168 140 182 135 200 135 C218 135 232 140 238 165 C230 145 218 140 200 140 C182 140 170 145 162 165 Z" fill="#475569" opacity="0.4"/>

  <!-- Eyes / Expression -->
  <ellipse cx="188" cy="180" rx="3.5" ry="4.5" fill="#1e293b"/>
  <ellipse cx="212" cy="180" rx="3.5" ry="4.5" fill="#1e293b"/>
  <circle cx="189" cy="178.5" r="1.2" fill="#ffffff"/>
  <circle cx="213" cy="178.5" r="1.2" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M182 171 Q188 168 194 171" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M206 171 Q212 168 218 171" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M193 202 Q200 207 207 202" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

  <!-- Monogram Badge Tag at bottom -->
  <rect x="120" y="340" width="160" height="36" rx="18" fill="#090d16" stroke="url(#accentGrad)" stroke-width="2"/>
  <text x="200" y="363" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">DINI NADIA // M3</text>
</svg>

